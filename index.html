<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Worms Armageddon</title>
<link rel="icon" href="/assets/gfx/icon_grenade.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Bungee&family=Inter:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <!-- game layers: owned by the (vanilla) engine, composited by the GPU -->
  <div id="app">
    <div id="bgSky"><div id="bgFx"></div></div>
    <img id="bgFar" class="bgLayer" alt="">
    <img id="bgMid" class="bgLayer" alt="">
    <canvas id="game"></canvas>
    <div id="vignette"></div>
    <div id="flashFx"></div>
  </div>
  <!-- everything else (menu, HUD, dialogs, toasts) is React + shadcn/ui -->
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
